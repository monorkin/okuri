name: okuri-test

# The destinations the conformance suite runs against.
#
#   docker compose -f test/compose.yaml up -d --wait
#   cargo test --workspace -- --ignored
#
# `--wait` matters: the bucket and container are made by one-shot services, and without it
# `up` returns before they have finished — the suite then fails on a bucket that is seconds away
# from existing.
#
# Every service is disposable and holds nothing worth keeping.

services:
  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: okuri:okuri:::scratch

  ftp:
    image: delfer/alpine-ftp-server
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    environment:
      USERS: "okuri|okuri|/home/okuri|1000"
      ADDRESS: localhost
      MIN_PORT: 21000
      MAX_PORT: 21010

  s3:
    image: minio/minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: okuri
      MINIO_ROOT_PASSWORD: okuri-secret
    command: server /data

  # MinIO starts empty, and a bucket that does not exist is not something the suite is meant to
  # be testing. Runs once and exits.
  s3-bucket:
    image: minio/mc
    depends_on:
      - s3
    entrypoint:
      - sh
      - -c
      - "until mc alias set okuri http://s3:9000 okuri okuri-secret; do sleep 1; done; mc mb --ignore-existing okuri/okuri-test"

  webdav:
    image: bytemark/webdav
    ports:
      - "8080:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: okuri
      PASSWORD: okuri

  azure:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0

  # The same for Azurite's container.
  azure-container:
    image: mcr.microsoft.com/azure-cli
    depends_on:
      - azure
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azure:10000/devstoreaccount1;"
    entrypoint:
      - sh
      - -c
      - "until az storage container create --name okuri-test; do sleep 1; done"
