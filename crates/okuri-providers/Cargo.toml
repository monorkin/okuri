[package]
name = "okuri-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Every destination Okuri can talk to"

[dependencies]
okuri-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
russh = "0.63"
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
time.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
aws-sdk-s3 = "1.144.0"
aws-config = "1.11.0"
aws-smithy-types = "1.6.2"
quick-xml = "0.42.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
base64 = "0.23.1"
suppaftp = { version = "10.0.2", features = ["tokio", "tokio-rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7.0"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = "0.9"
