[package]
name = "okuri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote storage that feels like a folder"

[dependencies]
okuri-core.workspace = true
okuri-engine.workspace = true
okuri-providers.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
# `local-offset` so modification times can be shown on the clock the person keeps rather than
# in UTC. It is read once, first thing in `main`, which is the only moment it is allowed.
time = { workspace = true, features = ["local-offset"] }
toml = "0.9"
tokio = { workspace = true, features = ["rt-multi-thread"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
